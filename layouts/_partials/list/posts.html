{{ range . }}
<section class="section container">
  <a href="{{ .RelPermalink }}" class="title">{{ .LinkTitle }}</a>
  <div class="subtitle content">
    {{ .Description }}
  </div>
  <div>
    {{ partial "post/taxonomies.html" . }}
    <a href="{{ .RelPermalink }}" class="has-text-weight-bold">
      Read More...
    </a>
    {{ partial "post/meta.html" . }}
  </div>
</section>
{{ end }}
