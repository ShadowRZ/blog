<ul class="tags are-medium">
  {{ range .GetTerms "categories" }}
  <li>
    <a href="{{ .RelPermalink }}" class="tag is-primary icon-text">
      <span class="ph--folders-duotone"></span>
      <span>{{ .LinkTitle }}</span>
    </a>
  </li>
  {{ end }}
  {{ range .GetTerms "tags" }}
  <li>
    <a href="{{ .RelPermalink }}" class="tag is-secondary icon-text">
      <span class="ph--tag-duotone"></span>
      <span>{{ .LinkTitle }}</span>
    </a>
  </li>
  {{ end }}
</ul>
